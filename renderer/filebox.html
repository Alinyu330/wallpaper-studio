<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>FileBox</title>
  <style>
    :root {
      --icon-size: 52px;
      --gap: 12px;
      --bg-op: 0.32;
      --idle-op: 0.28;       /* 空闲（鼠标离开）整体不透明度 */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: rgba(255, 255, 255, 0.004);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none; -webkit-user-select: none;
      cursor: default;
    }

    #widget { position: absolute; left: 0; top: 0; }

    /* ---------- 玻璃样式：毛玻璃 / 液态玻璃 / 无（与桌面组件同一套词汇） ----------
       面板底色与模糊参数抽成三个变量，由 body.style-* 赋值：#panel（展开）与
       #fold .fold-ico（收缩成一枚图标）共用，避免两处各写一份漂移。 */
    body.style-frosted {
      --fb-glass-bg: rgba(14, 16, 24, var(--bg-op));
      --fb-glass-blur: blur(16px) saturate(1.25);
      --fb-glass-edge: rgba(255, 255, 255, .14);
    }
    body.style-liquid {
      --fb-glass-bg: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 42%, rgba(14,16,24, calc(var(--bg-op) + .12)));
      --fb-glass-blur: blur(22px) saturate(1.6) brightness(1.06);
      --fb-glass-edge: rgba(255, 255, 255, .30);
    }
    body.style-none {
      --fb-glass-bg: rgba(14, 16, 24, var(--bg-op));
      --fb-glass-blur: none;
      --fb-glass-edge: rgba(255, 255, 255, .10);
    }
    #panel {
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px 14px;
      border-radius: 18px;
      background: var(--fb-glass-bg, rgba(14, 16, 24, var(--bg-op)));
      backdrop-filter: var(--fb-glass-blur, blur(16px) saturate(1.25));
      -webkit-backdrop-filter: var(--fb-glass-blur, blur(16px) saturate(1.25));
      box-shadow: 0 6px 24px rgba(0, 0, 0, .22);
      transition: opacity .45s ease, transform .45s cubic-bezier(.2,.8,.3,1);
    }
    body.style-liquid #panel {
      box-shadow: 0 6px 24px rgba(0, 0, 0, .22), inset 0 1px 0 var(--fb-glass-edge), inset 0 -1px 0 rgba(255,255,255,.10);
    }
    /* 空闲态：整体半透明毛玻璃（不打扰壁纸观看） */
    body.idle #panel { opacity: var(--idle-op); }

    /* ---------- 空闲收缩为单个文件图标 ---------- */
    /* 计数角标必须落在 #fold 矩形「内侧」：窗口尺寸就是按它的 getBoundingClientRect
       上报的，角标外溢会被窗口边缘直接裁掉（表现为数量显示不全）。 */
    #fold {
      position: relative; width: 60px; height: 60px; cursor: pointer; display: none;
      transition: opacity .45s ease;
    }
    #fold .fold-ico {
      width: 60px; height: 60px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: var(--fb-glass-bg, rgba(14, 16, 24, var(--bg-op)));
      border: 1px solid var(--fb-glass-edge, rgba(255, 255, 255, .14));
      backdrop-filter: var(--fb-glass-blur, blur(12px) saturate(1.25));
      -webkit-backdrop-filter: var(--fb-glass-blur, blur(12px) saturate(1.25));
      box-shadow: 0 4px 16px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .10);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    #fold .fold-ico svg { width: 30px; height: 30px; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35)); }
    #fold:hover .fold-ico {
      transform: translateY(-1px);
      box-shadow: 0 7px 22px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255, 255, 255, .16);
    }
    #fold .fold-count {
      position: absolute; top: 2px; right: 2px; display: none;
      min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
      background: linear-gradient(180deg, #5b9bff, #3a72e8);
      border: 1px solid rgba(255, 255, 255, .38);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
      color: #fff; font-size: 11.5px; font-weight: 600; line-height: 18px;
      text-align: center; font-variant-numeric: tabular-nums;
    }
    #fold.has-items .fold-count { display: block; }
    body.collapsed #panel { display: none; }
    body.collapsed #fold { display: block; }
    /* 收缩态同样吃空闲透明度，但下限 0.5 —— 收成一枚图标后再淡就找不着了 */
    body.idle #fold { opacity: max(0.5, var(--idle-op)); }

    /* 面板镜像倒影：强度读 --mirror-a；窗口高度由 reportMetrics 加上倒影高度 */
    body.mirror #panel {
      -webkit-box-reflect: below 2px linear-gradient(to bottom, transparent 55%, rgba(0, 0, 0, var(--mirror-a, .25)));
    }
    body.mirror #fold {
      -webkit-box-reflect: below 2px linear-gradient(to bottom, transparent 55%, rgba(0, 0, 0, var(--mirror-a, .25)));
    }
    /* 统一调色 + 不透明度：#widget 无 opacity/transform 规则，不与收起/调整态冲突 */
    #widget {
      filter: brightness(var(--fb-br, 1)) contrast(var(--fb-ct, 1)) saturate(var(--fb-sa, 1));
      opacity: var(--fb-op, 1);
    }

    /* 分类标题行 */
    .group-head {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: rgba(255, 255, 255, 0.55);
      letter-spacing: .5px; padding: 0 2px;
    }
    .group-head .line { flex: 1; height: 1px; background: rgba(255,255,255,.10); }

    /* 网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(var(--cols, 5), var(--icon-size));
      gap: var(--gap);
    }

    .item {
      position: relative;
      width: var(--icon-size); height: calc(var(--icon-size) + 18px);
      border-radius: 13px;
      background: transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
    }
    .item:hover {
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .28);
    }
    .item img {
      width: 40px; height: 40px; pointer-events: none;
      filter: none;
    }
    .item .fallback {
      width: 40px; height: 40px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, #4f8cff, #34c3d9);
      pointer-events: none;
    }
    /* 文件名进入布局流：旧实现 absolute top:100% 挂在格子外，
       既压到下一行、又被按面板矩形裁切的窗口切掉最后一行 */
    .item .name {
      width: 100%; text-align: center;
      font-size: 10px; line-height: 1.25; margin-top: 2px;
      color: rgba(255, 255, 255, 0.92);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-all;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }
    .item .x {
      position: absolute; top: -6px; right: -6px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #ff5c6c; color: #fff; font-size: 12px; line-height: 18px;
      text-align: center; display: none;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .4);
    }
    body.manage .item .x { display: block; }
    body.manage .item { background: rgba(255, 92, 108, .18); }

    /* 添加按钮 */
    #add-btn {
      display: flex; align-items: center; justify-content: center;
      width: var(--icon-size); height: var(--icon-size);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px dashed rgba(255, 255, 255, 0.22);
      color: rgba(255, 255, 255, 0.65);
      font-size: 21px; line-height: 1;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s, transform .14s, box-shadow .14s;
    }
    #add-btn:hover { background: rgba(76, 140, 255, 0.25); border-color: #4f8cff; color: #fff; }
    /* 桌面拖拽收纳：拖入期间保持展开并描边，靠近「＋」时吸附放大 */
    body.dropping #add-btn { border-color: rgba(120, 170, 255, .85); color: #fff; }
    #add-btn.hot {
      background: rgba(79, 140, 255, 0.34);
      border-color: #8fb6ff; border-style: solid; color: #fff;
      transform: scale(1.16);
      box-shadow: 0 0 0 3px rgba(79, 140, 255, .22), 0 6px 18px rgba(30, 70, 160, .45);
    }
    body.dropping #fold .fold-ico { border-color: rgba(120, 170, 255, .85); }
    body.dropping #fold.hot .fold-ico {
      border-color: #8fb6ff; border-style: solid;
      transform: scale(1.1);
      box-shadow: 0 0 0 3px rgba(79, 140, 255, .22), 0 7px 22px rgba(30, 70, 160, .5);
    }

    /* 空状态 */
    #empty-hint {
      color: rgba(255, 255, 255, 0.55);
      font-size: 12.5px; letter-spacing: .5px; white-space: nowrap;
      padding: 6px 4px;
    }

    /* 调整模式 */
    body.adjusting #panel {
      outline: 2px dashed rgba(124, 92, 255, .9);
      outline-offset: 5px;
      cursor: move;
    }

    /* 右键菜单 */
    #ctx-menu {
      position: fixed; z-index: 999;
      min-width: 150px; padding: 5px;
      border-radius: 12px;
      background: rgba(20, 22, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 34px rgba(0, 0, 0, .45);
      font-size: 12.5px; color: #e8eaf2;
    }
    #ctx-menu button {
      display: flex; width: 100%; align-items: center; justify-content: space-between;
      gap: 14px; padding: 7px 11px;
      background: none; border: none; border-radius: 8px;
      color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    #ctx-menu button:hover { background: rgba(255, 255, 255, 0.10); }
    #ctx-menu button.danger { color: #ff8a94; }
    #ctx-menu .check { font-size: 11px; color: #7c5cff; }
  </style>
</head>
<body>
  <div id="widget">
    <div id="fold" title="点击展开文件收纳">
      <div class="fold-ico">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9.5V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9.5" stroke="#cfe0ff" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M2.6 9.5h18.8l-1.5 3.2a2 2 0 0 1-1.8 1.1H5.9a2 2 0 0 1-1.8-1.1L2.6 9.5z" fill="#5b9bff"/>
          <path d="M8 7.4h8M9.6 4.8h4.8" stroke="#9fc0ff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="fold-count" id="fold-count">0</div>
    </div>
    <div id="panel">
      <div id="content"></div>
    </div>
  </div>

  <div id="ctx-menu" style="display:none"></div>

  <script>
    const H = window.fileboxHost;
    const content = document.getElementById('content');
    const panel = document.getElementById('panel');
    const ctxMenu = document.getElementById('ctx-menu');

    let cfg = { gridCols: 5, groupBy: 'kind', bgOpacity: 0.32, idleOpacity: 0.28, autoIdle: true, items: [] };
    let manageMode = false;
    let adjusting = false;
    let idle = false;

    // 排序依据分组
    const FOLDER_KINDS = ['folder'];
    function kindOf(it) { return it.type === 'folder' ? 'folder' : 'file'; }

    function sortItems(items, groupBy) {
      const arr = [...items];
      if (groupBy === 'name') {
        arr.sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh'));
      } else if (groupBy === 'mtime') {
        arr.sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
      } else if (groupBy === 'manual') {
        // manual：保持 items 原始顺序（主进程已按用户自定义顺序存）
      } else { // kind：文件夹在前，文件在后；同类按名称
        arr.sort((a, b) => {
          const ka = kindOf(a) === 'folder' ? 0 : 1;
          const kb = kindOf(b) === 'folder' ? 0 : 1;
          if (ka !== kb) return ka - kb;
          return String(a.name).localeCompare(String(b.name), 'zh');
        });
      }
      return arr;
    }

    function render() {
      const items = cfg.items || [];
      document.documentElement.style.setProperty('--cols', String(Math.min(12, Math.max(3, cfg.gridCols || 5))));
      document.documentElement.style.setProperty(
        '--bg-op', String(Math.min(0.85, Math.max(0.1, Number(cfg.bgOpacity ?? 0.32)))));
      document.documentElement.style.setProperty(
        '--idle-op', String(Math.min(0.6, Math.max(0.1, Number(cfg.idleOpacity ?? 0.28)))));
      // 玻璃样式：frosted 毛玻璃 / liquid 液态玻璃 / none 半透明无模糊
      const style = ['frosted', 'liquid', 'none'].includes(cfg.style) ? cfg.style : 'frosted';
      for (const s of ['frosted', 'liquid', 'none']) {
        document.body.classList.toggle('style-' + s, s === style);
      }
      // 镜像与调色 → CSS 变量 / body 类
      const mir = cfg.mirror !== false;
      document.body.classList.toggle('mirror', mir);
      document.documentElement.style.setProperty(
        '--mirror-a', String(Math.min(1, Math.max(0, Number(cfg.mirrorOpacity ?? 25) / 100))));
      const pct = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : d) / 100;
      document.documentElement.style.setProperty('--fb-br', String(pct(cfg.brightness, 100)));
      document.documentElement.style.setProperty('--fb-ct', String(pct(cfg.contrast, 100)));
      document.documentElement.style.setProperty('--fb-sa', String(pct(cfg.saturate, 100)));
      document.documentElement.style.setProperty('--fb-op', String(Math.min(1, Math.max(0.1, pct(cfg.opacity, 100)))));
      const fc = document.getElementById('fold-count');
      const fold = document.getElementById('fold');
      const n = (cfg.items || []).length;
      if (fc) fc.textContent = n > 99 ? '99+' : String(n);
      if (fold) fold.classList.toggle('has-items', n > 0);
      content.innerHTML = '';

      if (!items.length) {
        const empty = document.createElement('p');
        empty.id = 'empty-hint';
        empty.textContent = '还没有收纳文件，右键或点 ＋ 添加';
        content.appendChild(empty);
        requestAnimationFrame(reportMetrics);
        return;
      }

      const sorted = sortItems(items, cfg.groupBy || 'kind');

      // 分类排列：kind 分组时按「文件夹 / 文件」分两段；其余按单一网格
      if ((cfg.groupBy || 'kind') === 'kind') {
        const folders = sorted.filter((it) => it.type === 'folder');
        const files = sorted.filter((it) => it.type !== 'folder');
        if (folders.length) appendGroup('文件夹', folders);
        if (files.length) appendGroup('文件', files);
      } else {
        appendGroup(null, sorted);
      }

      requestAnimationFrame(reportMetrics);
    }

    function appendGroup(label, groupItems) {
      if (label) {
        const head = document.createElement('div');
        head.className = 'group-head';
        const t = document.createElement('span');
        t.textContent = label;
        const line = document.createElement('span');
        line.className = 'line';
        head.append(t, line);
        content.appendChild(head);
      }
      const grid = document.createElement('div');
      grid.className = 'grid';
      groupItems.forEach((it, gi) => {
        const el = document.createElement('div');
        el.className = 'item';
        el.title = it.name;
        if (it.icon) {
          const img = document.createElement('img');
          img.src = it.icon;
          img.draggable = false;
          el.appendChild(img);
        } else {
          const fb = document.createElement('div');
          fb.className = 'fallback';
          fb.textContent = (it.name || '?').slice(0, 1).toUpperCase();
          el.appendChild(fb);
        }
        const nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = it.name;
        el.appendChild(nm);
        const x = document.createElement('span');
        x.className = 'x';
        x.textContent = '✕';
        el.appendChild(x);
        // 记录在原始 items 中的索引（点击/移除按全局索引）
        const globalIdx = (cfg.items || []).indexOf(it);
        el.dataset.i = String(globalIdx);
        el.addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return;
          if (adjusting) return; // 调整模式下由窗口层拦截拖动
          if (manageMode) { H.remove(globalIdx); return; }
          H.launch(globalIdx);
        });
        grid.appendChild(el);
      });
      // 添加按钮放在网格末尾
      const add = document.createElement('div');
      add.id = 'add-btn';
      add.title = '添加文件或文件夹';
      add.textContent = '＋';
      add.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || adjusting) return;
        H.addItems();
      });
      grid.appendChild(add);
      content.appendChild(grid);
    }

    function reportMetrics() {
      const isCollapsed = document.body.classList.contains('collapsed');
      const el = isCollapsed ? document.getElementById('fold') : panel;
      const r = el.getBoundingClientRect();
      if (r.width > 10 && r.height > 10) {
        // 镜像倒影画在元素下方，窗口必须留出倒影高度，否则被裁掉（展开面板与收缩图标同理）
        const mirrorH = document.body.classList.contains('mirror')
          ? Math.ceil(r.height * 0.45) : 0;
        H.reportMetrics({ w: Math.ceil(r.width), h: Math.ceil(r.height) + mirrorH });
      }
      reportRects();
    }

    function reportRects() {
      const isCollapsed = document.body.classList.contains('collapsed');
      const el = isCollapsed ? document.getElementById('fold') : panel;
      const r = el.getBoundingClientRect();
      if (r.width < 2) return;
      const dpr = window.devicePixelRatio || 1;
      H.reportRects([{
        x: Math.round(r.left * dpr), y: Math.round(r.top * dpr),
        w: Math.round(r.width * dpr), h: Math.round(r.height * dpr),
      }]);
    }

    // ---------- 空闲：先半透明毛玻璃、再收缩为单个文件图标 ----------
    let collapsed = false;
    let dimTimer = null, foldTimer = null;
    function setCollapsed(v) {
      if (collapsed === v) return;
      collapsed = v;
      document.body.classList.toggle('collapsed', v);
      requestAnimationFrame(reportMetrics); // 窗口尺寸随展开/收缩变化
    }
    function setIdle(v) {
      if (idle === v) return;
      idle = v;
      document.body.classList.toggle('idle', v);
      if (!v) reportRects(); // 展开后命中矩形可能变化
    }
    function scheduleIdle() {
      clearTimeout(dimTimer); clearTimeout(foldTimer);
      if (adjusting) return;
      // 关掉「空闲自动收起」= 常驻展开，不能停在收缩成的单图标态
      if (cfg.autoIdle === false || !(cfg.items || []).length) {
        setIdle(false);
        setCollapsed(false);
        return;
      }
      dimTimer = setTimeout(() => setIdle(true), 900);
      foldTimer = setTimeout(() => { setIdle(true); setCollapsed(true); }, 2600);
    }
    function wake() {
      clearTimeout(dimTimer); clearTimeout(foldTimer);
      setIdle(false);
      setCollapsed(false);
    }
    // 点击单图标 → 弹出收纳内容；点击面板内任意处 → 保持展开（重新计时）
    document.getElementById('fold').addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || adjusting) return;
      wake();
      scheduleIdle();
    });
    panel.addEventListener('pointerdown', () => {
      if (adjusting) return;
      wake();
      scheduleIdle();
    });

    // ---------- 调整模式拖动 ----------
    window.addEventListener('pointerdown', (e) => {
      if (!adjusting || e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      H.setInteracting(true);
      H.dragStart();
      window.addEventListener('pointermove', onAdjustMove, true);
      window.addEventListener('pointerup', onAdjustUp, true);
      window.addEventListener('pointercancel', onAdjustUp, true);
    }, true);
    function onAdjustMove() { H.dragMove(); }
    function onAdjustUp() {
      window.removeEventListener('pointermove', onAdjustMove, true);
      window.removeEventListener('pointerup', onAdjustUp, true);
      window.removeEventListener('pointercancel', onAdjustUp, true);
      H.dragEnd();
      H.setInteracting(false);
    }

    // ---------- 右键菜单 ----------
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showCtx(e.clientX, e.clientY);
    });
    function showCtx(x, y) {
      ctxMenu.innerHTML = '';
      const mk = (label, fn, opts = {}) => {
        const b = document.createElement('button');
        if (opts.danger) b.className = 'danger';
        b.innerHTML = `<span>${label}</span>${opts.checked ? '<span class="check">✓</span>' : ''}`;
        b.addEventListener('click', () => { hideCtx(); fn(); });
        ctxMenu.appendChild(b);
      };
      mk('添加文件 / 文件夹', () => H.addItems());
      mk(manageMode ? '退出移除模式' : '移除文件 / 文件夹', () => {
        manageMode = !manageMode;
        document.body.classList.toggle('manage', manageMode);
      }, { checked: manageMode, danger: manageMode });
      ctxMenu.style.display = 'block';
      const rect = ctxMenu.getBoundingClientRect();
      const w = window.innerWidth, h = window.innerHeight;
      ctxMenu.style.left = Math.min(x, w - rect.width - 6) + 'px';
      ctxMenu.style.top = Math.min(y, h - rect.height - 6) + 'px';
    }
    function hideCtx() { ctxMenu.style.display = 'none'; }
    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('#ctx-menu')) hideCtx();
    });

    // ---------- 主进程事件 ----------
    H.onConfig((c) => {
      cfg = c || {};
      render();
      scheduleIdle();
      setTimeout(reportRects, 120);
    });

    H.onHover((v) => {
      if (v) wake();
      else scheduleIdle();
    });

    H.onAdjust((v) => {
      const on = !!(v && v.on);
      if (adjusting === on) return;
      adjusting = on;
      document.body.classList.toggle('adjusting', on);
      if (on) {
        clearTimeout(dimTimer);
        clearTimeout(foldTimer);
        setIdle(false);
        setCollapsed(false);
        manageMode = false;
        document.body.classList.remove('manage');
        hideCtx();
      } else {
        scheduleIdle();
      }
      setTimeout(reportRects, 80);
    });

    // ---------- 桌面拖拽收纳（把文件拖到「＋」上） ----------

    const MAGNET = 96;            // CSS px：指针进入该半径即「吸附」
    let dragDepth = 0, dropping = false;
    /** 吸附锚点：展开态是「＋」，收缩态是那枚单图标 */
    function dropAnchor() {
      return document.body.classList.contains('collapsed')
        ? document.getElementById('fold')
        : document.getElementById('add-btn');
    }
    function setDropping(v) {
      if (dropping === v) return;
      dropping = v;
      document.body.classList.toggle('dropping', v);
      if (v) wake();
      else {
        const a = dropAnchor();
        if (a) a.classList.remove('hot');
        scheduleIdle();
      }
    }
    function droppedPaths(e) {
      const dt = e.dataTransfer;
      if (!dt) return [];
      const out = [];
      try {
        for (const f of dt.files || []) if (f.path) out.push(f.path);
      } catch (_) {}
      if (!out.length) {
        try {
          for (const line of String(dt.getData('text/uri-list') || '').split(/\r?\n/)) {
            if (line.startsWith('file://')) out.push(decodeURIComponent(line.replace(/^file:\/\/?/, '/')).replace(/^\//, ''));
          }
        } catch (_) {}
      }
      return out;
    }
    document.addEventListener('dragenter', (e) => { dragDepth++; setDropping(true); e.preventDefault(); });
    document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; setDropping(false); } });
    document.addEventListener('dragover', (e) => {
      e.preventDefault();
      try { e.dataTransfer.dropEffect = 'copy'; } catch (_) {}
      setDropping(true);
      const a = dropAnchor();
      if (!a) return;
      const r = a.getBoundingClientRect();
      const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      a.classList.toggle('hot', d <= MAGNET);
    });
    document.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragDepth = 0;
      const paths = droppedPaths(e);
      setDropping(false);
      if (!paths.length) return;
      try { await H.dropPaths(paths); } catch (_) {}
    });

    // ---------- 启动 ----------
    H.ready();
    window.addEventListener('resize', () => { reportMetrics(); });
    setInterval(reportRects, 800);
  </script>
</body>
</html>
