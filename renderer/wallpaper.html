<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Wallpaper</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* 静态层堆叠容器：交叉淡入时新图叠在旧图之上（旧图保持完整显示垫底） */
    #img-stage { position: absolute; inset: 0; }
    #img-stage img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: none;
    }
    #img-stage img.fading-in { opacity: 0; transition: opacity .6s ease; }
    #web {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; display: none; background: #000;
    }
  </style>
</head>
<body>
  <div id="img-stage"></div>
  <iframe id="web" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
  <script>
    const stage = document.getElementById('img-stage');
    const webEl = document.getElementById('web');
    let webLoadedUrl = null;
    let curImg = null;

    function buildFilter(p) {
      const b = (100 + (p.brightness || 0)) / 100;
      const c = (100 + (p.contrast || 0)) / 100;
      const s = (100 + (p.saturation || 0)) / 100;
      return `brightness(${b}) contrast(${c}) saturate(${s})`;
    }
    function fitOf(p) { return p.fit === 'contain' ? 'contain' : (p.fit === 'stretch' ? 'fill' : 'cover'); }
    function ready() { try { window.wallpaperHost.ready(); } catch (_) {} }
    function hideWeb() { webEl.style.display = 'none'; }
    function clearImgs() { stage.innerHTML = ''; curImg = null; }

    function renderImage(payload) {
      hideWeb();
      const img = document.createElement('img');
      img.src = 'file:///' + payload.src.replace(/\\/g, '/');
      img.style.objectFit = fitOf(payload.params);
      img.style.filter = buildFilter(payload.params);
      const show = () => {
        if (payload.crossfade && curImg) {
          img.classList.add('fading-in');
          img.style.display = 'block';
          stage.appendChild(img);
          requestAnimationFrame(() => requestAnimationFrame(() => { img.style.opacity = '1'; }));
          const old = curImg;
          curImg = img;
          setTimeout(() => old.remove(), 750);
        } else {
          clearImgs();
          img.style.display = 'block';
          stage.appendChild(img);
          curImg = img;
        }
        ready();
      };
      if (img.complete && img.naturalWidth > 0) show();
      else { img.onload = show; img.onerror = () => ready(); }
    }
    function renderWeb(payload) {
      clearImgs();
      webEl.style.display = 'block';
      const url = payload.url || payload.src;
      if (webLoadedUrl !== url) { webEl.src = url; webLoadedUrl = url; }
      webEl.style.filter = buildFilter(payload.params);
      ready();
    }
    function renderBlank() {
      clearImgs();
      hideWeb();
      webEl.src = 'about:blank';
      webLoadedUrl = null;
    }

    if (window.wallpaperHost && window.wallpaperHost.onRender) {
      window.wallpaperHost.onRender((payload) => {
        switch (payload.type) {
          case 'image': return renderImage(payload);
          case 'web': return renderWeb(payload);
          case 'video': return renderBlank();
          default: return renderBlank();
        }
      });
    }
  </script>
</body>
</html>
