<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Launcher</title>
  <style>
    :root {
      --icon-size: 46px;
      --slot: 56px;            /* 图标位宽 = 46 + 10 间距 */
      --bg-op: 0.32;           /* 面板底色不透明度（配置可调） */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      /* 1/255 白底：全透明首帧 Chromium 跳过 present → DWM 拒绝合成（见 widgets.html） */
      background: rgba(255, 255, 255, 0.004);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none; -webkit-user-select: none;
      cursor: default;
    }

    #widget { position: absolute; left: 0; top: 0; }

    /* ---------- 展开的转盘（无面板：仅图标 + 旋转条，悬浮于壁纸） ---------- */
    #expanded {
      display: flex; flex-direction: column; align-items: stretch;
      padding: 4px 8px;
      border-radius: 20px;
      transition: opacity .28s ease, transform .28s cubic-bezier(.2, .8, .3, 1);
      transform-origin: 14px 50%;
    }
    /* 倒影空间：横向在右侧图标下方渐隐（由 #dragbar 顶距留出），纵向在右侧预留 */
    body.vertical #expanded { padding-right: 38px; }
    body.vertical #expanded { transform-origin: 50% 14px; }
    body.collapsed #expanded {
      opacity: 0; transform: scale(.12);
      pointer-events: none;
    }

    #row { display: flex; align-items: center; gap: 10px; }
    /* 纵向排列：整列布局 */
    body.vertical #expanded { flex-direction: column; align-items: center; }
    body.vertical #row { flex-direction: column; gap: 8px; }

    /* ---------- 调整模式（客户端「调整位置」按钮触发；桌面本身无拖动手柄） ---------- */
    body.adjusting #expanded {
      outline: 2px dashed rgba(124, 92, 255, .9);
      outline-offset: 5px;
      cursor: move;
    }
    body.adjusting #dragbar .bar-hint {
      opacity: 1;
      background: rgba(124, 92, 255, .9);
      color: #fff;
    }

    /* 图标条（横 / 纵由 JS 设定尺寸） */
    #strip { position: relative; }
    body.horizontal #strip { height: var(--icon-size); }
    body.vertical #strip { width: var(--icon-size); }
    .item {
      position: absolute; left: 0; top: 0;
      width: var(--icon-size); height: var(--icon-size);
      border-radius: 12px;
      background: transparent;          /* 默认无底无框，融入壁纸 */
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
      will-change: transform, opacity;
    }
    .item:hover {
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .28);
    }
    .item img {
      width: 38px; height: 38px; pointer-events: none;
      object-fit: contain;
      border-radius: 10px;              /* 真图标多为透明底方形 PNG，圆角与转盘卡片语言协调 */
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .35)); /* 仅投影；亮度/对比由 #widget 统一调 */
    }
    /* 「常用」角标：开机/重启后打开转盘时，常用项已被排在最前，这里只做视觉标记 */
    .item .pin-dot {
      position: absolute; top: 3px; right: 3px; z-index: 2;
      width: 8px; height: 8px; border-radius: 50%;
      background: #ffb020;
      border: 1px solid rgba(20, 16, 8, .55);
      box-shadow: 0 0 6px rgba(255, 176, 32, .75);
      pointer-events: none;
    }
    /* 快捷方式倒影：跟随转盘实时镜像，远离图标方向渐隐；强度可读 --mirror-a 调节 */
    body.horizontal .item {
      -webkit-box-reflect: below 1px linear-gradient(to bottom, transparent 34%, rgba(0, 0, 0, var(--mirror-a, .30)));
    }
    body.vertical .item {
      -webkit-box-reflect: right 1px linear-gradient(to right, transparent 34%, rgba(0, 0, 0, var(--mirror-a, .30)));
    }
    body.no-mirror .item { -webkit-box-reflect: none; }
    /* 转盘整体调色 + 不透明度：#widget 无 opacity/transform 规则，
       不会与收起动画冲突；展开态与胶囊态、以及 .item 上的倒影一并生效 */
    #widget {
      filter: brightness(var(--lc-br, 1)) contrast(var(--lc-ct, 1)) saturate(var(--lc-sa, 1));
      opacity: var(--lc-op, 1);
    }
    .item .fallback {
      width: 38px; height: 38px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, #7c5cff, #4f8cff);
      pointer-events: none;
    }
    /* 系统特殊项图标（回收站/控制面板/网络/此电脑） */
    .item .sys-ico {
      width: 38px; height: 38px; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    .item .sys-ico svg { width: 34px; height: 34px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
    /* 移除模式角标 */
    .item .x {
      position: absolute; top: -6px; right: -6px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #ff5c6c; color: #fff; font-size: 12px; line-height: 18px;
      text-align: center; display: none;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .4);
    }
    body.manage .item .x { display: block; }
    body.manage .item { background: rgba(255, 92, 108, .18); }

    /* 添加按钮 */
    #add-btn {
      flex: none; width: var(--icon-size); height: var(--icon-size);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px dashed rgba(255, 255, 255, 0.22);
      color: rgba(255, 255, 255, 0.65);
      font-size: 21px; line-height: 1;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s, transform .14s, box-shadow .14s;
    }
    #add-btn:hover { background: rgba(124, 92, 255, 0.25); border-color: #7c5cff; color: #fff; }
    /* 桌面拖拽收纳：拖入窗口期间保持展开并描边提示，靠近「＋」时吸附放大 */
    body.dropping #add-btn { border-color: rgba(167, 139, 255, .8); color: #fff; }
    #add-btn.hot {
      background: rgba(124, 92, 255, 0.34);
      border-color: #a78bff; border-style: solid; color: #fff;
      transform: scale(1.16);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, .22), 0 6px 18px rgba(80, 40, 180, .45);
    }

    /* 空状态提示 */
    #empty-hint {
      align-self: center; color: rgba(255, 255, 255, 0.55);
      font-size: 12.5px; letter-spacing: .5px; white-space: nowrap;
      padding: 0 8px;
    }
    body.vertical #empty-hint { writing-mode: vertical-rl; padding: 8px 0; }

    /* 拖动条（转盘轮换）——短横杠 + 发光圆钮 */
    #dragbar {
      position: relative;
      align-self: center;
      margin-top: 26px;                 /* 图标倒影的渐隐区 */
      width: 64px; height: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: grab;
    }
    body.vertical #dragbar {
      width: 14px; height: 64px;
      margin-top: 2px;
    }
    /* 拖动轨道：等高的胶囊盘（两端半圆收口，中间与两边同厚）+ 两端小圆点 */
    #dragbar::before {
      content: ''; position: absolute;
      left: 0; right: 0; top: 50%; height: 13px; margin-top: -6.5px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 15% 50%, rgba(255, 255, 255, .78) 0 2.1px, rgba(255, 255, 255, 0) 2.6px),
        radial-gradient(circle at 85% 50%, rgba(255, 255, 255, .78) 0 2.1px, rgba(255, 255, 255, 0) 2.6px),
        linear-gradient(180deg,
          rgba(255, 255, 255, .30), rgba(255, 255, 255, .11) 48%, rgba(255, 255, 255, .05));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .26), 0 2px 8px rgba(0, 0, 0, .30);
      transition: background .15s, box-shadow .15s;
    }
    body.vertical #dragbar::before {
      left: 50%; right: auto; top: 0; bottom: 0;
      width: 13px; height: auto; margin: 0 0 0 -6.5px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 255, 255, .78) 0 2.1px, rgba(255, 255, 255, 0) 2.6px),
        radial-gradient(circle at 50% 85%, rgba(255, 255, 255, .78) 0 2.1px, rgba(255, 255, 255, 0) 2.6px),
        linear-gradient(90deg,
          rgba(255, 255, 255, .30), rgba(255, 255, 255, .11) 48%, rgba(255, 255, 255, .05));
    }
    /* 中心主圆 */
    #dragbar::after {
      content: ''; position: absolute; left: 50%; top: 50%;
      width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #fff, rgba(255, 255, 255, .82) 58%, rgba(214, 210, 232, .78));
      box-shadow: 0 0 8px rgba(124, 92, 255, .60), 0 1px 3px rgba(0, 0, 0, .40);
      transition: transform .15s, background .15s, box-shadow .15s;
    }
    #dragbar:hover::before {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .40), 0 2px 10px rgba(0, 0, 0, .34);
    }
    #dragbar:hover::after {
      transform: scale(1.26);
      box-shadow: 0 0 12px rgba(124, 92, 255, .95), 0 1px 3px rgba(0, 0, 0, .40);
    }
    #dragbar:active { cursor: grabbing; }
    #dragbar:active::before {
      background:
        radial-gradient(circle at 15% 50%, rgba(226, 219, 255, .95) 0 2.1px, rgba(255, 255, 255, 0) 2.6px),
        radial-gradient(circle at 85% 50%, rgba(226, 219, 255, .95) 0 2.1px, rgba(255, 255, 255, 0) 2.6px),
        linear-gradient(180deg,
          rgba(124, 92, 255, .66), rgba(124, 92, 255, .34) 48%, rgba(124, 92, 255, .20));
    }
    body.vertical #dragbar:active::before {
      background:
        radial-gradient(circle at 50% 15%, rgba(226, 219, 255, .95) 0 2.1px, rgba(255, 255, 255, 0) 2.6px),
        radial-gradient(circle at 50% 85%, rgba(226, 219, 255, .95) 0 2.1px, rgba(255, 255, 255, 0) 2.6px),
        linear-gradient(90deg,
          rgba(124, 92, 255, .66), rgba(124, 92, 255, .34) 48%, rgba(124, 92, 255, .20));
    }
    #dragbar:active::after { transform: scale(1.12); }
    #dragbar .bar-hint {
      position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
      font-size: 10px; color: rgba(255, 255, 255, 0.85);
      letter-spacing: 2px; pointer-events: none; white-space: nowrap;
      background: rgba(12, 14, 20, .82); padding: 1px 8px; border-radius: 6px;
      line-height: 14px;
      opacity: 0; transition: opacity .2s;
    }
    body.vertical #dragbar .bar-hint {
      bottom: auto; left: calc(100% + 5px); top: 50%; transform: translateY(-50%);
      writing-mode: vertical-rl; padding: 8px 1px;
    }
    #dragbar:hover .bar-hint { opacity: 1; }

    /* ---------- 收起后的胶囊（同风格无边框） ---------- */
    #pill {
      position: absolute; left: 0; top: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 7px 11px;
      border-radius: 16px;
      background: rgba(12, 14, 20, var(--bg-op));
      backdrop-filter: blur(10px) saturate(1.25);
      -webkit-backdrop-filter: blur(10px) saturate(1.25);
      box-shadow: 0 3px 14px rgba(0, 0, 0, .18);
      color: #fff;
      cursor: pointer;
      opacity: 0; transform: scale(.7);
      transition: opacity .25s ease .1s, transform .25s cubic-bezier(.2,.8,.3,1) .1s;
      pointer-events: none;
    }
    body.collapsed #pill { opacity: 1; transform: scale(1); pointer-events: auto; }
    #pill .pill-ico { font-size: 15px; line-height: 1; opacity: .9; }
    #pill .pill-count {
      font-size: 11px; font-weight: 600;
      color: #cfd4e6; background: rgba(255,255,255,.10);
      border-radius: 8px; padding: 1px 7px;
    }

    /* ---------- 右键菜单 ---------- */
    #ctx-menu {
      position: fixed; z-index: 999;
      min-width: 150px; padding: 5px;
      border-radius: 12px;
      background: rgba(20, 22, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 34px rgba(0, 0, 0, .45);
      font-size: 12.5px; color: #e8eaf2;
    }
    #ctx-menu button {
      display: flex; width: 100%; align-items: center; justify-content: space-between;
      gap: 14px; padding: 7px 11px;
      background: none; border: none; border-radius: 8px;
      color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    #ctx-menu button:hover { background: rgba(255, 255, 255, 0.10); }
    #ctx-menu button.danger { color: #ff8a94; }
    #ctx-menu .check { font-size: 11px; color: #7c5cff; }
  </style>
</head>
<body class="horizontal">
  <div id="widget">
    <div id="expanded">
      <div id="row">
        <div id="strip"></div>
        <span id="empty-hint" style="display:none">右键或点 ＋ 添加常用 App 快捷方式</span>
        <button id="add-btn" title="添加快捷方式">＋</button>
      </div>
      <div id="dragbar" title="按住拖动 · 像转盘一样轮换图标"><span class="bar-hint">⟨ 拖动轮换 ⟩</span></div>
    </div>
    <div id="pill" title="展开快捷方式转盘">
      <span class="pill-ico">⊞</span>
      <span class="pill-count" id="pill-count">0</span>
    </div>
  </div>

  <div id="ctx-menu" style="display:none"></div>

  <script>
    const H = window.launcherHost;
    const strip = document.getElementById('strip');
    const expandedEl = document.getElementById('expanded');
    const pillEl = document.getElementById('pill');
    const emptyHint = document.getElementById('empty-hint');
    const addBtn = document.getElementById('add-btn');
    const ctxMenu = document.getElementById('ctx-menu');
    const barHint = document.querySelector('#dragbar .bar-hint');

    let cfg = { count: 8, autoCollapse: true, orientation: 'h', bgOpacity: 0.32, edgeFade: false, shortcuts: [] };
    let N = 0;                  // 快捷方式总数
    let head = 0;               // 转盘旋转量：最左/最上槽位对应的条目索引（浮点，连续）
    let items = [];             // 图标元素（与 shortcuts 一一对应）
    let collapsed = false;
    let manageMode = false;
    let adjusting = false;      // 调整模式：客户端按钮触发，整窗可拖动
    let collapseTimer = null;
    let animId = null;
    let wheelSnapT = null;

    const SLOT = 56;
    const isVertical = () => (cfg.orientation === 'v');

    // ---------- 系统特殊项内置图标（回收站/控制面板/网络/此电脑） ----------
    function systemIconSvg(id) {
      const icons = {
        recycle: '<svg viewBox="0 0 24 24" fill="none"><path d="M6 8h12l-1.2 12.2a1.5 1.5 0 0 1-1.5 1.3H8.7a1.5 1.5 0 0 1-1.5-1.3L6 8z" fill="#5a8dee" stroke="#3c6cd0" stroke-width="1"/><path d="M4.5 8h15" stroke="#c3d4f5" stroke-width="1.4" stroke-linecap="round"/><path d="M9.5 11.5v7M14.5 11.5v7" stroke="#dfeafc" stroke-width="1.4" stroke-linecap="round"/></svg>',
        control: '<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="#4f8cff"/><g stroke="#dbe7ff" stroke-width="1.3"><circle cx="8.5" cy="8.5" r="1.6"/><circle cx="15.5" cy="8.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="8.5" cy="15.5" r="1.6"/><circle cx="15.5" cy="15.5" r="1.6"/></g></svg>',
        network: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.5" fill="#34c3d9"/><circle cx="12" cy="12" r="4" fill="#eafbfe"/><circle cx="12" cy="12" r="1.4" fill="#34c3d9"/></svg>',
        thispc: '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="12.5" rx="2" fill="#7c5cff"/><rect x="6" y="6.8" width="12" height="8" rx="1" fill="#e9e3ff"/><path d="M9.5 20h5M12 17.5V20" stroke="#7c5cff" stroke-width="1.6" stroke-linecap="round"/></svg>',
        userfiles: '<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 7.2a2 2 0 0 1 2-2h4l2 2.4h7a2 2 0 0 1 2 2v7.6a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V7.2z" fill="#f0b64d" stroke="#c98a24" stroke-width="1"/><path d="M3.5 10.6h17" stroke="#fdf0d2" stroke-width="1.2"/></svg>',
      };
      return icons[id] || null;
    }

    // ---------- 渲染 ----------

    function renderStrip() {
      N = cfg.shortcuts.length;
      strip.innerHTML = '';
      items = [];
      document.getElementById('pill-count').textContent = String(N);
      emptyHint.style.display = N ? 'none' : '';
      addBtn.style.display = N ? '' : 'none';
      if (!N) {
        strip.style.width = '150px';
        strip.style.height = '';
        requestAnimationFrame(reportMetrics);
        return;
      }
      const count = visibleCount();
      if (isVertical()) {
        strip.style.width = '';
        strip.style.height = (count * SLOT - (SLOT - 46)) + 'px';
      } else {
        strip.style.width = (count * SLOT - (SLOT - 46)) + 'px';
        strip.style.height = '';
      }
      cfg.shortcuts.forEach((s, i) => {
        const el = document.createElement('div');
        el.className = 'item';
        el.dataset.i = String(i);
        el.title = s.name;
        if (s.pinned) {
          const pin = document.createElement('i');
          pin.className = 'pin-dot';
          el.appendChild(pin);
          el.classList.add('pin');
        }
        if (s.icon) {
          // 真实图标：App 快捷方式取目标 exe 内嵌图标，系统项取 shell 命名空间图标
          const img = document.createElement('img');
          img.src = s.icon;
          img.draggable = false;
          el.appendChild(img);
        } else if (s.type === 'system' && systemIconSvg(s.sysId)) {
          // 系统项取不到真实图标时的兜底：内置 SVG
          const span = document.createElement('span');
          span.className = 'sys-ico';
          span.innerHTML = systemIconSvg(s.sysId);
          el.appendChild(span);
        } else {
          const fb = document.createElement('div');
          fb.className = 'fallback';
          fb.textContent = (s.name || '?').slice(0, 1).toUpperCase();
          el.appendChild(fb);
        }
        const x = document.createElement('span');
        x.className = 'x';
        x.textContent = '✕';
        el.appendChild(x);
        strip.appendChild(el);
        items.push(el);
      });
      head = ((head % N) + N) % N;
      layout();
      requestAnimationFrame(reportMetrics);
    }

    function visibleCount() {
      return Math.max(1, Math.min(cfg.count || 8, 12));
    }

    /** 按当前 head 布局所有图标（转盘效果；edgeFade 开启时边缘才淡化） */
    function layout() {
      if (!N) return;
      const count = visibleCount();
      const c = (count - 1) / 2;
      const vert = isVertical();
      for (const el of items) {
        const i = +el.dataset.i;
        const pos = (((i - head) % N) + N) % N;   // [0, N)
        const enterEnd = pos <= count - 1 + 0.45;
        const enterStart = pos >= N - 0.45;       // 回绕到起点进入
        if (!enterEnd && !enterStart) { el.style.display = 'none'; continue; }
        el.style.display = '';
        const slotPos = enterStart ? pos - N : pos;
        const d = slotPos - c;
        const dist = Math.abs(d);
        const t = `translate${vert ? 'Y' : 'X'}(${slotPos * SLOT}px) scale(${(1 - Math.min(0.30, dist * 0.08)).toFixed(3)})`;
        el.style.transform = t;
        // 默认全亮度显示（不压暗图标）；开启「边缘淡化」后才有远近透明度差
        el.style.opacity = cfg.edgeFade
          ? Math.max(0.25, 1 - Math.min(0.62, dist * 0.17)).toFixed(3)
          : '1';
        el.style.zIndex = String(100 - Math.round(dist * 2));
      }
    }

    // ---------- 转盘拖动轮换（带惯性 + 吸附；横排用 X 轴、竖排用 Y 轴） ----------

    let rotating = false;
    let rotStart = 0;
    let rotMoved = 0;
    let rotPressedIdx = -1;
    let lastMove = null;
    let vel = 0;   // 槽位/秒
    let interactingLock = false; // 轮换拖动期间保持窗口可点击（防止中途被置回穿透）

    function axisVal(e) { return isVertical() ? e.clientY : e.clientX; }

    function stopAnim() { if (animId) { cancelAnimationFrame(animId); animId = null; } }

    function snapToNearest() {
      stopAnim();
      const target = Math.round(head);
      const from = head, t0 = performance.now(), dur = 170;
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur);
        head = from + (target - from) * (1 - Math.pow(1 - p, 3));
        layout();
        animId = p < 1 ? requestAnimationFrame(step) : null;
      };
      animId = requestAnimationFrame(step);
    }

    function momentum() {
      stopAnim();
      let last = performance.now();
      const step = (now) => {
        const dt = Math.min(60, now - last); last = now;
        if (Math.abs(vel) > 0.4) {
          head -= vel * dt / 1000;
          vel *= Math.pow(0.9935, dt);
          layout();
          animId = requestAnimationFrame(step);
        } else {
          snapToNearest();
        }
      };
      animId = requestAnimationFrame(step);
    }

    function bindRotate(el) {
      el.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        rotating = true;
        rotStart = axisVal(e);
        rotMoved = 0;
        vel = 0;
        lastMove = { v: axisVal(e), t: performance.now() };
        rotPressedIdx = e.target.closest('.item') ? +e.target.closest('.item').dataset.i : -1;
        stopAnim();
        // ★ 交互锁：拖动/点击期间主进程保持窗口可点击，
        //   光标短暂离开矩形也不再中断（修复"拖动旋转无反应"）
        interactingLock = true;
        H.setInteracting(true);
        el.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      el.addEventListener('pointermove', (e) => {
        if (!rotating) return;
        const v = axisVal(e);
        const dv = v - rotStart;
        rotMoved = Math.max(rotMoved, Math.abs(dv));
        const now = performance.now();
        if (lastMove) {
          const dt = Math.max(1, now - lastMove.t);
          const inst = -((v - lastMove.v) / SLOT) / (dt / 1000);
          vel = 0.75 * vel + 0.25 * inst;
        }
        lastMove = { v, t: now };
        head -= dv / SLOT;
        rotStart = v;
        layout();
      });
      const up = (e) => {
        if (!rotating) return;
        rotating = false;
        if (interactingLock) { interactingLock = false; H.setInteracting(false); }
        if (rotMoved < 6 && rotPressedIdx >= 0) {
          // 点击（非拖动）：启动 / 移除模式下移除
          if (manageMode) { H.remove(rotPressedIdx); }
          else { H.launch(rotPressedIdx); pulseLaunch(); }
          snapToNearest();
          return;
        }
        if (Math.abs(vel) > 1.2) momentum();
        else snapToNearest();
      };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    }
    bindRotate(strip);
    bindRotate(document.getElementById('dragbar'));

    function pulseLaunch() {
      expandedEl.style.transform = 'scale(0.94)';
      setTimeout(() => { expandedEl.style.transform = ''; }, 150);
    }

    // 滚轮同样可轮换（调整模式下禁用，避免与整窗拖动冲突）
    for (const el of [strip, document.getElementById('dragbar')]) {
      el.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (adjusting) return;
        stopAnim();
        head += (isVertical() ? e.deltaY : e.deltaY) * 0.0022;
        layout();
        clearTimeout(wheelSnapT);
        wheelSnapT = setTimeout(snapToNearest, 160);
      }, { passive: false });
    }

    // ---------- 收起 / 展开 ----------

    function setCollapsed(v) {
      if (collapsed === v) return;
      if (v && adjusting) return;   // 调整模式下强制保持展开（配置推送会重排收起定时器）
      collapsed = v;
      document.body.classList.toggle('collapsed', v);
      setTimeout(reportRects, v ? 60 : 300);  // 过渡结束后上报命中矩形
    }

    function scheduleCollapse() {
      clearTimeout(collapseTimer);
      if (adjusting) return;        // 同上：调整模式期间不自动收起
      if (cfg.autoCollapse && N) {
        collapseTimer = setTimeout(() => setCollapsed(true), 3200);
      }
    }

    pillEl.addEventListener('click', (e) => {
      if (adjusting) return;
      setCollapsed(false);
    });

    // ---------- 调整模式拖动（客户端「调整位置」按钮触发） ----------
    // capture 阶段拦截指针事件：调整中任何按下都拖动整个窗口，
    // 阻止转盘轮换/图标点击/收起等桌面交互；主进程 dragEnd 保存位置并自动退出调整模式。

    window.addEventListener('pointerdown', (e) => {
      if (!adjusting || e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      H.setInteracting(true);
      H.dragStart();
      window.addEventListener('pointermove', onAdjustMove, true);
      window.addEventListener('pointerup', onAdjustUp, true);
      window.addEventListener('pointercancel', onAdjustUp, true);
    }, true);

    function onAdjustMove() { H.dragMove(); }
    function onAdjustUp() {
      window.removeEventListener('pointermove', onAdjustMove, true);
      window.removeEventListener('pointerup', onAdjustUp, true);
      window.removeEventListener('pointercancel', onAdjustUp, true);
      H.dragEnd();
      H.setInteracting(false);
    }

    // ---------- 右键菜单 ----------

    addBtn.addEventListener('click', () => H.addShortcuts());

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showCtx(e.clientX, e.clientY);
    });

    function showCtx(x, y) {
      ctxMenu.innerHTML = '';
      const mk = (label, fn, opts = {}) => {
        const b = document.createElement('button');
        if (opts.danger) b.className = 'danger';
        b.innerHTML = `<span>${label}</span>${opts.checked ? '<span class="check">✓</span>' : ''}`;
        b.addEventListener('click', () => { hideCtx(); fn(); });
        ctxMenu.appendChild(b);
      };
      mk('添加快捷方式', () => H.addShortcuts());
      mk(manageMode ? '退出移除模式' : '移除快捷方式', () => {
        manageMode = !manageMode;
        document.body.classList.toggle('manage', manageMode);
      }, { checked: manageMode, danger: manageMode });
      mk(collapsed ? '展开转盘' : '立即收起', () => setCollapsed(!collapsed));
      ctxMenu.style.display = 'block';
      const rect = ctxMenu.getBoundingClientRect();
      const w = window.innerWidth, h = window.innerHeight;
      ctxMenu.style.left = Math.min(x, w - rect.width - 6) + 'px';
      ctxMenu.style.top = Math.min(y, h - rect.height - 6) + 'px';
    }
    function hideCtx() { ctxMenu.style.display = 'none'; }
    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('#ctx-menu')) hideCtx();
    });

    // ---------- 尺寸 / 命中矩形上报 ----------

    function reportMetrics() {
      // ★ 必须用 offsetWidth/offsetHeight（布局尺寸，不受 CSS transform 影响）。
      //   收起态 #expanded 带 scale(.12) 变换，getBoundingClientRect 量到的是缩放后
      //   尺寸（约 1/8）——若在收起时上报（点九宫格/改配置触发 renderStrip→rAF），
      //   主进程会把窗口缩成贴任务栏的细条，转盘被窗体裁剪形同被任务栏遮挡。
      const w = expandedEl.offsetWidth, h = expandedEl.offsetHeight;
      if (w > 10 && h > 10) {
        H.reportMetrics({ w, h });
      }
      reportRects();
    }

    function reportRects() {
      const el = collapsed ? pillEl : expandedEl;
      const r = el.getBoundingClientRect();
      if (r.width < 2) return;
      // 每次实时取 dpr：跨不同缩放率显示器拖放窗口时旧值会导致命中区错位
      // （"偶现鼠标靠近无法唤醒"的诱因之一）
      const dpr = window.devicePixelRatio || 1;
      H.reportRects([{
        x: Math.round(r.left * dpr), y: Math.round(r.top * dpr),
        w: Math.round(r.width * dpr), h: Math.round(r.height * dpr),
      }]);
    }

    // ---------- 主进程事件 ----------

    H.onConfig((c) => {
      const prevCount = cfg.count;
      const prevOrient = cfg.orientation;
      cfg = c || {};
      // 面板透明度 → CSS 变量；排列方向 → body 类
      document.documentElement.style.setProperty(
        '--bg-op', String(Math.min(0.85, Math.max(0.1, Number(cfg.bgOpacity ?? 0.32)))));
      // 镜像与调色 → CSS 变量 / body 类（#widget 与 .item 倒影统一生效）
      const mir = cfg.mirror !== false;
      document.body.classList.toggle('no-mirror', !mir);
      document.documentElement.style.setProperty(
        '--mirror-a', String(Math.min(1, Math.max(0, Number(cfg.mirrorOpacity ?? 30) / 100))));
      const pct = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : d) / 100;
      document.documentElement.style.setProperty('--lc-br', String(pct(cfg.brightness, 100)));
      document.documentElement.style.setProperty('--lc-ct', String(pct(cfg.contrast, 100)));
      document.documentElement.style.setProperty('--lc-sa', String(pct(cfg.saturate, 100)));
      document.documentElement.style.setProperty('--lc-op', String(Math.min(1, Math.max(0.1, pct(cfg.opacity, 100)))));
      const orient = cfg.orientation === 'v' ? 'vertical' : 'horizontal';
      document.body.classList.toggle('vertical', orient === 'vertical');
      document.body.classList.toggle('horizontal', orient !== 'vertical');
      renderStrip();
      if (prevCount !== cfg.count) head = 0;
      if (prevOrient !== cfg.orientation) { head = 0; setTimeout(reportMetrics, 60); }
      if (collapsed && !cfg.autoCollapse) setCollapsed(false);
      // 初始（尚未发生任何悬停切换）也要进入「空闲自动收起」节奏：
      // hover 事件只在状态切换时到达，若不主动排定收起，转盘会一直展开
      scheduleCollapse();
      // 配置变化后强制上报一次命中矩形（位置/尺寸可能已变化）
      setTimeout(reportRects, 120);
    });

    H.onHover((v) => {
      if (v) {
        clearTimeout(collapseTimer);
        setCollapsed(false);
      } else {
        scheduleCollapse();
      }
    });

    // 调整模式：强制展开、停用自动收起、显示提示；退出后恢复原有节奏
    H.onAdjust((v) => {
      const on = !!(v && v.on);
      if (adjusting === on) return;
      adjusting = on;
      document.body.classList.toggle('adjusting', on);
      if (on) {
        clearTimeout(collapseTimer);
        manageMode = false;
        document.body.classList.remove('manage');
        if (collapsed) setCollapsed(false);
        barHint.textContent = '拖动调整位置';
        hideCtx();
      } else {
        barHint.textContent = '⟨ 拖动轮换 ⟩';
        scheduleCollapse();
      }
      setTimeout(reportRects, 80);
    });

    // ---------- 桌面拖拽收纳（把桌面图标拖到「＋」上） ----------

    const MAGNET = 96;            // CSS px：指针进入该半径即「吸附」
    let dragDepth = 0, dropping = false;
    function setDropping(v) {
      if (dropping === v) return;
      dropping = v;
      document.body.classList.toggle('dropping', v);
      if (v) { clearTimeout(collapseTimer); setCollapsed(false); }
      else { addBtn.classList.remove('hot'); scheduleCollapse(); }
    }
    function droppedPaths(e) {
      const dt = e.dataTransfer;
      if (!dt) return [];
      const out = [];
      try {
        for (const f of dt.files || []) if (f.path) out.push(f.path);
      } catch (_) {}
      if (!out.length) {
        // 兜底：部分拖拽源只给 text/uri-list
        try {
          for (const line of String(dt.getData('text/uri-list') || '').split(/\r?\n/)) {
            if (line.startsWith('file://')) out.push(decodeURIComponent(line.replace(/^file:\/\/?/, '/')).replace(/^\//, ''));
          }
        } catch (_) {}
      }
      return out;
    }
    document.addEventListener('dragenter', (e) => { dragDepth++; setDropping(true); e.preventDefault(); });
    document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; setDropping(false); } });
    document.addEventListener('dragover', (e) => {
      e.preventDefault();
      try { e.dataTransfer.dropEffect = 'copy'; } catch (_) {}
      setDropping(true);
      const r = addBtn.getBoundingClientRect();
      const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      addBtn.classList.toggle('hot', d <= MAGNET);
    });
    document.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragDepth = 0;
      const paths = droppedPaths(e);
      setDropping(false);
      if (!paths.length) return;
      try { await H.dropPaths(paths); } catch (_) {}
    });

    // ---------- 启动 ----------

    H.ready();
    window.addEventListener('resize', () => { reportMetrics(); });

    // 周期性重报命中矩形：转盘收起/展开、位置拖动、多显示器 DPI 变化后，
    // 若某次事件漏报，主进程轮询命中区会停在旧值 → "偶现鼠标靠近无法唤醒"。
    // 每 800ms 兜底重报一次，保证命中区始终与实际布局一致。
    setInterval(reportRects, 800);
  </script>
</body>
</html>
